name: RTL verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  memory:
    name: Memory interface verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned verification tools
        run: python3 tools/bootstrap.py
      - name: Prove memory, AXI and CDC safety, test independent memory models
        run: make memory-test axi-test cdc-test image-loader-test
      - name: Preserve memory verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-verification
          path: |
            reports/memory-*.json
            reports/masked-bram*.json
            reports/axi*.json
            reports/cdc*.json
            reports/async-axi*.json
            reports/image-loader*.json
            build/formal-memory-*/*.log
            build/memory-bridge/*.log
            build/masked-bram/*.log
            build/masked-bram/mapped/*.log
            build/masked-bram/mapped/lut-proof/*.json
            build/formal-axi/*.log
            build/axi-memory/*.log
            build/axi-memory/mapped/*.log
            build/axi-memory/mapped/lut-proof/*.json
            build/formal-cdc/*.log
            build/memory-cdc/*.log
            build/memory-cdc/mapped/*.log
            build/memory-cdc/mapped/lut-proof/*.json
            build/async-axi-memory/*.log
            build/async-axi-memory/mapped/*.log
            build/async-axi-memory/mapped/lut-proof/*.json
            build/formal-image-loader/*.log
            build/image-loader/*/*.log
            build/image-loader/*/mapped/*.log
            build/image-loader/*/mapped/lut-proof/*.json
          if-no-files-found: warn
          retention-days: 30
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned local tools and upstream tests
        run: python3 tools/bootstrap.py
      - name: Lint and independent arithmetic verification
        run: |
          make lint test-divider test-simd test-popcount test-values test-descriptors test-ecp5-ram test-core-four-state test-fpu prove-masks
          python3 tools/prove_descriptors.py
          python3 tests/check_timing_test.py
          python3 tests/run_spec_runner_test.py
          python3 tests/gate_compiler_test.py
          python3 tests/spec_ci_test.py
      - name: Compile RTL and verify boundary and oracle behavior
        run: |
          make sim
          python3 tools/check_engine.py
          python3 tests/spec_partition_runner_test.py
      - name: Complete official suite
        run: python3 tools/run_spec.py --report reports/core.json
      - name: Complete official suite with memory stalls
        run: python3 tools/run_spec.py --wait-states 3 --report reports/core-stalled.json
      - name: Verify complete serial FPGA interface in simulation
        run: make fpga-smoke
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          overwrite: true
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30

  mapped-build:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned tools and official sources
        run: python3 tools/bootstrap.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-reports
          path: reports/native
      - name: Assign every official command to exactly one worker
        id: plan
        run: python3 tools/spec_ci.py plan --reference reports/native/core-stalled.json --shards 16 --output reports/mapped-plan.json --github-output "$GITHUB_OUTPUT"
      - name: Synthesize the production ECP5 core
        run: |
          python3 tools/generate_fpga_ports.py
          make fpga-core
      - name: Compile the mapped circuit for all worker CPUs
        run: python3 tools/build_gate_sim.py --core-netlist build/core-ecp5.json --build-directory build/gate-ci --fast-sim --fast-luts --portable --jobs 2
      - name: Verify partition accounting on the real mapped simulator
        env:
          WASMETAL_TEST_SIMULATOR: build/gate-ci/obj/Vwasmetal_core
        run: python3 tests/spec_partition_runner_test.py
      - name: Package the simulator and its verified inputs
        run: python3 tools/spec_ci.py pack --simulator build/gate-ci/obj/Vwasmetal_core --output reports/mapped-simulator.tar.gz
      - name: Preserve mapped model and ownership plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapped-simulator
          overwrite: true
          path: |
            reports/mapped-simulator.tar.gz
            reports/mapped-plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapped-build-reports
          overwrite: true
          path: |
            reports/mapped-plan.json
            build/core-ecp5*.log
            build/core-ecp5*.json
            build/gate-ci/*.log
            build/gate-ci/lut-proof/*.json
          if-no-files-found: warn
          retention-days: 30

  mapped:
    name: Mapped circuit (${{ matrix.shard }})
    needs: mapped-build
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mapped-build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned tools and official sources
        run: python3 tools/bootstrap.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mapped-simulator
          path: build/ci-artifact
      - name: Restore the same mapped simulator on every worker
        run: |
          tar -xzf build/ci-artifact/mapped-simulator.tar.gz
          python3 tools/build_identity.py verify build/gate-ci/obj/Vwasmetal_core
      - name: Run assigned official commands on the synthesized circuit
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          python3 tools/run_spec.py --simulator build/gate-ci/obj/Vwasmetal_core
          --shard-plan build/ci-artifact/mapped-plan.json --shard-id "$SHARD"
          --wait-states 3 --jobs 2 --response-timeout 18000
          --progress-report "reports/progress-$SHARD.json"
          --report "reports/mapped-shard-$SHARD.json"
      - name: Preserve shard results even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapped-results-${{ matrix.shard }}
          overwrite: true
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30

  mapped-complete:
    name: Complete mapped corpus
    if: always()
    needs: [core, mapped-build, mapped]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require all builds and test workers to succeed
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BUILD_RESULT: ${{ needs.mapped-build.result }}
          MAPPED_RESULT: ${{ needs.mapped.result }}
        run: test "$CORE_RESULT" = success && test "$BUILD_RESULT" = success && test "$MAPPED_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned tools and official sources
        run: python3 tools/bootstrap.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-reports
          path: reports/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mapped-build-reports
          path: build/ci-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mapped-results-*
          path: reports/shards
      - name: Require exact corpus coverage and agreement with original RTL
        run: >-
          python3 tools/spec_ci.py merge --reference reports/native/core-stalled.json
          --plan build/ci-plan/reports/mapped-plan.json --reports reports/shards
          --output reports/mapped-complete.json
      - name: Preserve complete mapped verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapped-complete
          overwrite: true
          path: reports/mapped-complete.json
          if-no-files-found: warn
          retention-days: 30

  standalone:
    name: Standalone FPGA system
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned simulation and FPGA tools
        run: python3 tools/bootstrap.py --fpga-tools
      - name: Verify standalone RTL, map the complete system, route and compare circuit behavior
        run: make standalone-mapped-test
      - name: Audit generic memories and ASIC implementation boundaries
        run: python3 tools/audit_asic.py
      - name: Share the complete bounded CPU mapping with programmable system verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-core-mapping
          path: |
            build/standalone-core-ecp5.json
            build/standalone-core-ecp5.manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve standalone verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-verification
          overwrite: true
          path: |
            reports/standalone*.json
            reports/benchmarks.json
            reports/asic-audit.json
            build/asic-audit/*.log
            build/standalone-core-ecp5*.log
            build/standalone-core-ecp5.manifest.json
            build/standalone-ulx3s/*.log
            build/standalone-ulx3s/timing*.json
            build/standalone-gate-sim/*.log
            build/standalone-gate-sim/lut-proof/report.json
            build/standalone-ram-check/*.log
            build/standalone-memory-production/*.log
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve verified bitstream and prepared program
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-fpga
          overwrite: true
          path: |
            build/standalone-ulx3s/wasmetal.bit
            build/standalone-ulx3s/manifest.json
            build/standalone-image/
          if-no-files-found: error
          retention-days: 30

  programmable:
    name: Programmable simulation build
    needs: standalone
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned simulation and FPGA tools
        run: python3 tools/bootstrap.py --fpga-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone-core-mapping
          path: build
      - name: Verify uploads, execution, recovery and board serial timing in RTL
        run: make loadable-test
      - name: Audit writable memories and ASIC boot assumptions
        run: python3 tools/audit_asic.py --loadable
      - name: Map the programmable CPU and verify its RAM modes
        run: make loadable-mapped-build
      - name: Package the portable mapped simulator and all generated inputs
        run: python3 tools/loadable_ci.py pack
      - name: Preserve the native integration reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loadable-native
          path: reports/loadable-rtl.json
          if-no-files-found: error
          retention-days: 30
      - name: Share the programmable circuit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loadable-simulator
          path: reports/loadable-simulator.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Preserve programmable verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loadable-verification
          path: |
            reports/loadable-*.json
            reports/asic-loadable-audit.json
            build/loadable-*/*.log
            build/loadable-ulx3s/timing*.json
            build/loadable-gate-sim/lut-proof/report.json
            build/asic-loadable-audit/*.log
          if-no-files-found: warn
          retention-days: 30

  programmable-board:
    name: Programmable FPGA routing
    needs: standalone
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned FPGA tools
        run: python3 tools/bootstrap.py --fpga-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone-core-mapping
          path: build
      - name: Route the complete programmable board and verify timing and bitstream round trip
        run: python3 tools/build_loadable_board.py
      - name: Check mapped UART and reset synchronization and clock structure
        run: python3 tools/audit_loadable_io.py
      - name: Preserve the verified programmable bitstream
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loadable-fpga
          path: |
            build/loadable-ulx3s/wasmetal.bit
            build/loadable-ulx3s/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve routing and I/O diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loadable-routing
          path: |
            reports/loadable-io.json
            build/loadable-ulx3s/*.log
            build/loadable-ulx3s/timing*.json
          if-no-files-found: warn
          retention-days: 30

  programmable-mapped:
    name: Programmable mapped circuit (${{ matrix.shard }})
    needs: programmable
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned tools and prepare the Wasm loading front end
        run: |
          python3 tools/bootstrap.py
          make sim
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loadable-simulator
          path: build/ci-artifact
      - name: Restore the same mapped circuit on every worker
        run: tar -xzf build/ci-artifact/loadable-simulator.tar.gz
      - name: Run assigned upload and execution cases through serial pins
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 tools/loadable_ci.py run --shard "$SHARD"
      - name: Preserve mapped integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loadable-results-${{ matrix.shard }}
          path: reports/loadable-mapped-*.json
          if-no-files-found: warn
          retention-days: 30

  programmable-complete:
    name: Complete programmable circuit integration
    if: always()
    needs: [programmable, programmable-mapped, programmable-board]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require all integration builds and workers to succeed
        env:
          BUILD_RESULT: ${{ needs.programmable.result }}
          MAPPED_RESULT: ${{ needs.programmable-mapped.result }}
          ROUTING_RESULT: ${{ needs.programmable-board.result }}
        run: test "$BUILD_RESULT" = success && test "$MAPPED_RESULT" = success && test "$ROUTING_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore pinned source and primitive-library inputs for provenance checks
        run: python3 tools/bootstrap.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loadable-native
          path: reports/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loadable-results-*
          path: reports/shards
      - name: Require all integration cases and exact UART and cycle agreement
        run: python3 tools/loadable_ci.py merge --reference reports/native/loadable-rtl.json --reports reports/shards
      - name: Preserve complete programmable verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loadable-complete
          path: reports/loadable-mapped.json
          if-no-files-found: warn
          retention-days: 30
