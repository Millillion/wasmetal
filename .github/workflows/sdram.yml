name: SDRAM controller verification
on:
  push:
    paths:
      - 'rtl/**'
      - 'soc/**'
      - 'sim/**'
      - 'fpga/**'
      - 'tests/**'
      - 'tools/**'
      - 'third_party/**'
      - 'examples/**'
      - 'Makefile'
      - 'docs/verification/standalone-ci/**'
      - '.github/workflows/sdram.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  system:
    name: Complete CPU through SDRAM (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 25mhz
            arguments: --timing 25mhz
            negative: read-corruption
          - name: 100mhz-startup
            arguments: --timing 100mhz --startup-cycles 5000000
            negative: startup-bypass
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned tools and build the preparation frontend
        run: |
          python3 tools/bootstrap.py
          make sim
      - name: Verify all 35 programmable system cases through SDRAM
        run: python3 tools/check_sdram_system.py ${{ matrix.arguments }}
      - name: Reject the deliberate integration fault
        run: |
          ulimit -c 0
          python3 tools/check_sdram_system.py ${{ matrix.arguments }} --negative-control ${{ matrix.negative }}
      - name: Preserve system observations, device coverage and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdram-system-${{ matrix.name }}
          path: |
            reports/sdram-system-*.json
            build/sdram-system-*/*.log
            build/sdram-system-*/coverage.jsonl
            build/sdram-system-*/*.sv
            build/sdram-system-*/*.svh
            build/sdram-system-*/obj/*.build.json
          if-no-files-found: warn
          retention-days: 30
  functional:
    name: Native, mapped and four-state SDRAM checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned verification tools
        run: python3 tools/bootstrap.py
      - name: Check six profiles against independent pin and byte models
        run: python3 tools/check_sdram.py --mapped
      - name: Check X/Z controls and read data
        run: python3 tools/check_sdram_four_state.py
      - name: Preserve observations, identities and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdram-functional
          path: |
            reports/sdram-mapped.json
            reports/sdram-four-state.json
            build/sdram-*/*.log
            build/sdram-*/mapped/*.log
            build/sdram-*/mapped/obj/*.build.json
            build/sdram-*/mapped/lut-proof/*.json
          if-no-files-found: warn
          retention-days: 30
  formal:
    name: SDRAM protocol induction
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned verification tools
        run: python3 tools/bootstrap.py
      - name: Reject seven mutations and prove protocol invariants
        run: python3 tools/prove_sdram.py
      - name: Preserve proofs and counterexamples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdram-formal
          path: |
            reports/sdram-proof.json
            build/formal-sdram/*.log
            build/formal-sdram/*.ys
            build/formal-sdram/*.sv
          if-no-files-found: warn
          retention-days: 30
